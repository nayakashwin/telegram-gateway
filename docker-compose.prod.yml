# Production docker-compose: secrets come from ./secrets/ files mounted as
# Docker secrets at /run/secrets/<name>. The gateway reads them via the
# <VAR>_FILE env vars. TLS is required (no insecure-DB escape hatch).
#
# Setup: write ./secrets/{telegram_bot_token,gateway_api_key,database_url},
# then: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  gateway:
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      GATEWAY_API_KEY_FILE: /run/secrets/gateway_api_key
      DATABASE_URL_FILE: /run/secrets/database_url
      ALLOW_INSECURE_DB_TLS: "false"
    secrets:
      - telegram_bot_token
      - gateway_api_key
      - database_url

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  gateway_api_key:
    file: ./secrets/gateway_api_key
  database_url:
    file: ./secrets/database_url
