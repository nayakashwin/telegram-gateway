# Postgres config override enabling TLS for the compose DB.
# Certificates are copied to a writable location by the db service command
# wrapper in docker-compose.yml (mounted read-only at /certs).

listen_addresses = '*'
ssl = on
ssl_cert_file = '/var/lib/postgresql/certs/server.crt'
ssl_key_file = '/var/lib/postgresql/certs/server.key'
