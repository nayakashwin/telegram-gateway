services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: gateway
    volumes:
      - pgdata:/var/lib/postgresql/data
      # TLS certificates for the internal connection (generated by scripts/gen-db-certs.sh).
      - ./db-certs:/certs:ro
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - sh
      - -c
      - |
        mkdir -p /var/lib/postgresql/certs
        cp /certs/server.crt /certs/server.key /var/lib/postgresql/certs/
        chown -R postgres:postgres /var/lib/postgresql/certs
        chmod 600 /var/lib/postgresql/certs/server.key
        exec docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - gateway-net

  gateway:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://gateway:${POSTGRES_PASSWORD:-gateway}@db:5432/gateway?sslmode=require
      ALLOW_INSECURE_DB_TLS: "false"
      # Single knob for the published port; the container listens on the same
      # port so host and container stay consistent.
      GATEWAY_API_ADDRESS: ":${GATEWAY_API_PORT:-8080}"
      METRICS_ADDRESS: ":${METRICS_PORT:-9100}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GATEWAY_API_PORT:-8080}:${GATEWAY_API_PORT:-8080}"
      - "${METRICS_PORT:-9100}:${METRICS_PORT:-9100}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:${GATEWAY_API_PORT:-8080}/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - gateway-net

volumes:
  pgdata:

networks:
  gateway-net:
