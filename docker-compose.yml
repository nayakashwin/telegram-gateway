services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      # Required: no weak default. docker compose errors if POSTGRES_PASSWORD is unset.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # TLS certificates for the internal connection (generated by scripts/gen-db-certs.sh).
      - ./db-certs:/certs:ro
      - ./db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      # Hardened auth: scram-sha-256 for all connections (no trust).
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    tmpfs:
      - /tmp
      - /var/run/postgresql
      # Cert copy target: must be writable while the rootfs is read-only.
      - /var/lib/postgresql/certs
    command:
      - sh
      - -c
      - |
        cp /certs/server.crt /certs/server.key /var/lib/postgresql/certs/
        chown postgres:postgres /var/lib/postgresql/certs/*
        chmod 600 /var/lib/postgresql/certs/server.key
        exec docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway} -d ${POSTGRES_DB:-gateway}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    # The postgres entrypoint must chown PGDATA and the socket dir during init,
    # so keep the minimal capabilities it needs and drop the rest.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gateway-net

  gateway:
    build: .
    env_file:
      - .env
    volumes:
      # CA used to verify the Postgres server certificate (sslmode=verify-full).
      - ./db-certs/ca.crt:/certs/ca.crt:ro
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-gateway}?sslmode=verify-full&sslrootcert=/certs/ca.crt
      ALLOW_INSECURE_DB_TLS: "false"
      # Single knob for the published port; the container listens on the same
      # port so host and container stay consistent.
      GATEWAY_API_ADDRESS: ":${GATEWAY_API_PORT:-8080}"
      METRICS_ADDRESS: ":${METRICS_PORT:-9100}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GATEWAY_API_PORT:-8080}:${GATEWAY_API_PORT:-8080}"
      - "${METRICS_PORT:-9100}:${METRICS_PORT:-9100}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:${GATEWAY_API_PORT:-8080}/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - gateway-net

volumes:
  pgdata:

networks:
  gateway-net:
